# production: trigger deploy (no functional change)
services:
  app:
    image: crewflow-app:latest
    ports:
      - "3001:3001"
      - "3002:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - IMPORT_REPORTS_RETENTION_DAYS=${IMPORT_REPORTS_RETENTION_DAYS}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_FORCE_PASSWORD=${ADMIN_FORCE_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - REPORT_GENERAL_RECIPIENTS=${REPORT_GENERAL_RECIPIENTS}
      - RELATORIO_EMAIL_SERVICE_TOKEN=${RELATORIO_EMAIL_SERVICE_TOKEN}
      - DRAKE_ENVIRONMENT=${DRAKE_ENVIRONMENT}
      - DRAKE_API_BASE_URL=${DRAKE_API_BASE_URL}
      - DRAKE_SYNC_PATH=${DRAKE_SYNC_PATH}
      - DRAKE_SYNC_WORKER_PATH=${DRAKE_SYNC_WORKER_PATH}
      - DRAKE_API_KEY=${DRAKE_API_KEY}
      - DRAKE_TENANT_ID=${DRAKE_TENANT_ID}
      - DRAKE_TENANT_HEADER_NAME=${DRAKE_TENANT_HEADER_NAME}
      - DRAKE_AUTH_HEADER_NAME=${DRAKE_AUTH_HEADER_NAME}
      - DRAKE_TIMEOUT_MS=${DRAKE_TIMEOUT_MS}
      - DRAKE_WEBHOOK_ENABLED=${DRAKE_WEBHOOK_ENABLED}
      - DRAKE_SYNC_SESSION_ENABLED=${DRAKE_SYNC_SESSION_ENABLED}
      - DRAKE_SYNC_SESSION_BASE_PATH=${DRAKE_SYNC_SESSION_BASE_PATH}
      - DRAKE_SYNC_SESSION_TIMEOUT_MS=${DRAKE_SYNC_SESSION_TIMEOUT_MS}
      - DRAKE_CADASTRO_MIN_START_AT=${DRAKE_CADASTRO_MIN_START_AT}
      - DRAKE_OUTBOX_SERVICE_TOKEN=${DRAKE_OUTBOX_SERVICE_TOKEN}
      - NODE_ENV=production
    container_name: crewflow-app-production
    volumes:
      # Disponibiliza planilhas de vínculos para o container
      - /opt/projetogran/data:/app/data:ro
      # Exporta relatórios gerados pelo script para o host
      - /opt/projetogran/relatorios:/app/relatorios:rw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - projetogran_crewflow-network
    depends_on:
      - postgres-prod

  drake-outbox-worker:
    image: crewflow-app:latest
    container_name: crewflow-drake-outbox-worker
    environment:
      - DRAKE_OUTBOX_WORKER_ENABLED=${DRAKE_OUTBOX_WORKER_ENABLED}
      - DRAKE_OUTBOX_TARGET_URL=http://app:3001/api/admin/integracoes/drake/outbox/processar
      - DRAKE_OUTBOX_SERVICE_TOKEN=${DRAKE_OUTBOX_SERVICE_TOKEN}
      - DRAKE_OUTBOX_INTERVAL_MINUTES=${DRAKE_OUTBOX_INTERVAL_MINUTES}
      - DRAKE_OUTBOX_INITIAL_DELAY_MS=${DRAKE_OUTBOX_INITIAL_DELAY_MS}
      - DRAKE_OUTBOX_LIMIT=${DRAKE_OUTBOX_LIMIT}
      - DRAKE_ENVIRONMENT=${DRAKE_ENVIRONMENT}
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
    command: >
      sh -lc 'if [ "$$DRAKE_OUTBOX_WORKER_ENABLED" = "true" ]; then
        node scripts/drake-outbox-worker.js;
      else
        echo "[drake-outbox-worker] Desabilitado por DRAKE_OUTBOX_WORKER_ENABLED=$$DRAKE_OUTBOX_WORKER_ENABLED";
        tail -f /dev/null;
      fi'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - projetogran_crewflow-network
    depends_on:
      - app

  postgres-prod:
    image: postgres:15
    container_name: postgres-prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - projetogran_crewflow-network

  pgadmin-production:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-production
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_SETUP_EMAIL=${PGADMIN_SETUP_EMAIL}
      - PGADMIN_SETUP_PASSWORD=${PGADMIN_SETUP_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=True
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - projetogran_crewflow-network
    depends_on:
      - postgres-prod

networks:
  projetogran_crewflow-network:
    external: true

volumes:
  postgres_data:
  pgadmin_data:
